server {
    listen 80;
    server_name brus16.ru www.brus16.ru;

    location /.well-known/acme-challenge/ {
        alias /usr/share/nginx/html/letsencrypt/.well-known/acme-challenge/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name brus16.ru www.brus16.ru;

    root /usr/share/nginx/html;

    ssl_certificate /etc/letsencrypt/live/brus16.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brus16.ru/privkey.pem;

    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location /admin/ {
        proxy_pass http://sqlite-web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /admin;
        proxy_set_header X-Forwarded-Prefix /admin;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
