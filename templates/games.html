{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <div class="row">
        <div class="col-lg-8 mb-4">
            <div class="d-flex-medium flex-wrap gap-2 mb-4">
                <h2>Игры</h2>
                <form action="{{ url_for('games') }}" class="ms-auto btn-group" method="get">
                    <select id="tag" name="tag" class="h-fit form-select filter-btn create" style="width: auto; border-bottom-right-radius: 0; border-top-right-radius: 0;">
                        <option value="0">Все</option>
                        {% for tag in game_tags %}
                            <option value="{{ tag.id }}">{{ tag.name }}</option>
                        {% endfor %}
                    </select>
                    <button type="submit" class="btn mb-3 filter-btn create">Применить</button>
                </form>
                <a href="{{ url_for('upload_game') }}" class="btn filter-btn create h-fit">Загрузить игру</a>
            </div>

            <div class="row g-4">
                {% if not games %}
                    <div class="col-12">
                        <div class="card card-bg">
                            <div class="card-body">
                                <p class="card-text">Загрузите игру и будьте первым!</p>
                            </div>
                        </div>
                    </div>
                {% endif %}
                
                {% for game in games %}
                    {% include "partials/game_card.html" %}
                {% endfor %}
            </div>
        </div>

        {% include "partials/sidebar.html" %}
    </div>
</div>

{% endblock %}
